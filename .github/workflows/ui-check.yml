name: Windows revision UI check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Island-Windows-x64
          path: app
          github-token: ${{ github.token }}
          run-id: 42988999478
      - name: Dependencies
        run: python -m pip install websocket-client
      - name: Actual executable shortcut registration and UI checks
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222 --remote-allow-origins=*
        run: |
          $probe = Start-Process "$pwd/app/island.exe" -ArgumentList '--shortcut-probe' -PassThru -Wait
          Get-Content shortcut-probe.txt
          if ((Get-Content shortcut-probe.txt) -notmatch 'registration succeeded') {throw 'Ctrl+I registration failed'}
          $p = Start-Process "$pwd/app/island.exe" -PassThru
          python tests/windows-ui.py
          if ($LASTEXITCODE -ne 0) {throw 'UI check failed'}
          if ($p.HasExited) {throw 'Island exited unexpectedly'}
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-revision-check-evidence
          path: |
            windows-settings.png
            windows-ui-report.json
            shortcut-probe.txt
          retention-days: 7
