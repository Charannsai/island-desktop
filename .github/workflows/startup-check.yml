name: Windows startup smoke check
on:
  workflow_dispatch:
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Island-Windows-x64
          path: app
          github-token: ${{ github.token }}
          run-id: 42987187355
      - name: Launch built executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$pwd/app/island.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Island exited during startup, exit code $($p.ExitCode)" }
          Write-Output "Island remained running for 10 seconds. This does not verify media controls or display rendering."
          Stop-Process -Id $p.Id
