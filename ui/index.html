<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island</title>
<style>
  @font-face{font-family:Inter;src:url(fonts/inter-latin-variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}
  body{font-family:Inter,system-ui,sans-serif;color:#fff}

  #island{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000;
    overflow:hidden;cursor:default;will-change:width,height,border-radius;
    box-shadow:0 14px 44px rgba(0,0,0,.55), inset 0 0 0 .5px rgba(255,255,255,.07)}
  .view{position:absolute;inset:0;display:flex;align-items:center;will-change:opacity}
  .stag{will-change:transform,opacity}

  .titles{display:flex;flex-direction:column;min-width:0}
  .foot .batt{margin-left:12px}
  .t1{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:11.5px;font-weight:400;color:rgba(255,255,255,.52);white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}

  .art{border-radius:9px;flex:none;background:#1c1c22 center/cover;position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
  .art svg{opacity:.5}

  .wave{display:flex;align-items:center;gap:2.5px;height:20px}
  .wave i{display:block;width:3px;border-radius:2px;background:linear-gradient(180deg,#fff,#cfcfd6);height:6px}

  /* idle */
  .idle{justify-content:center;gap:14px;padding:0 16px}
  .idle .clock{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .idle .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
  .idle .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.3)}
  .idle .mnote{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.75);max-width:130px}
  .idle .mnote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* min */
  .mini{padding:0 12px;gap:11px}
  .mini .art{width:30px;height:30px;border-radius:8px}
  .mini .titles{min-width:0;flex:1}
  .mini .spacer{flex:0}

  /* max */
  .max{flex-direction:column;justify-content:flex-start;padding:18px 22px 14px;gap:12px}
  .mm-top{display:flex;align-items:center;gap:14px;width:100%}
  .mm-top .art{width:52px;height:52px;border-radius:12px}
  .mm-top .titles{min-width:0;flex:1}
  .mm-top .t1{font-size:16px}.mm-top .t2{font-size:12.5px}
  .prog{width:100%;display:flex;flex-direction:column;gap:6px}
  .track{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.16);position:relative;cursor:pointer}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff;width:0%}
  .knob{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4);opacity:0;transition:opacity .15s}
  .track:hover .knob{opacity:1}
  .times{display:flex;justify-content:space-between;font-size:10.5px;font-weight:500;
    color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;justify-content:center;gap:40px}
  .cbtn{cursor:pointer;opacity:.92;transition:opacity .12s,transform .12s}
  .cbtn:hover{opacity:1;transform:scale(1.08)}
  .cbtn:active{transform:scale(.94)}
  .divider{width:100%;height:1px;background:rgba(255,255,255,.09)}

  .sliders{display:flex;flex-direction:column;gap:10px;width:100%}
  .srow{display:flex;align-items:center;gap:10px;width:100%}
  .srow .sic{flex:none;opacity:.8;display:flex}
  .strack{flex:1;height:4.5px;border-radius:3px;background:rgba(255,255,255,.16);position:relative;cursor:pointer}
  .sfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff}
  .sval{width:34px;text-align:right;font-size:11px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}

  .foot{display:flex;align-items:center;width:100%;margin-top:auto}
  .foot .brand{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.35);text-transform:uppercase}
  .foot .quit{margin-left:auto;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.5);cursor:pointer;
    padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.08)}
  .foot .quit:hover{color:#fff;background:rgba(255,255,255,.14)}

  .batt{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}

  /* charging banner */
  .charge{justify-content:flex-start;padding:0 22px;gap:14px}
  .boltwrap{width:36px;height:36px;border-radius:50%;background:rgba(48,209,88,.16);display:flex;
    align-items:center;justify-content:center;flex:none}
  .charge .pct{margin-left:auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

  button,input{font:inherit}
  .foot button,.gear{border:0;color:#bbb;background:#19191e;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:11px}
  .foot button:hover,.gear:hover{background:#2b2b33;color:white}
  .gear{display:flex;align-items:center;justify-content:center;margin-left:8px;padding:5px}
  .mini .gear{margin-left:0}
  .settings{display:flex;flex-direction:column;align-items:stretch;padding:22px 24px;gap:13px}
  .settings h2{font-size:18px;font-weight:600;letter-spacing:-.04em}
  .settings .setting-top{display:flex;align-items:center;justify-content:space-between}
  .settings .hint{font-size:11px;color:#92929e;line-height:1.5}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:12px;min-height:24px}
  .setting-row input[type=range]{width:180px;accent-color:#fff}
  .setting-row input[type=checkbox]{width:16px;height:16px;accent-color:#fff;cursor:pointer}
  .setting-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
  .settings .setting-pair label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d5d5de;gap:10px}
  .setting-row output{display:inline-block;min-width:40px;text-align:right;color:#92929e;font-size:11px}
  .settings button{background:#24242b;color:#fff;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:12px}
  .settings .setting-footer{display:flex;gap:8px;align-items:center;margin-top:auto}
  .settings .exit{margin-left:auto;color:#e5a0a0;background:#281a1d}
.setting-pair input[type=checkbox]{appearance:none;border:1px solid #484850;border-radius:4px;background:#22222a;position:relative}.setting-pair input[type=checkbox]:checked{background:#dddde5;border-color:#dddde5}.setting-pair input[type=checkbox]:checked:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #111;border-width:0 2px 2px 0;transform:rotate(45deg)}
</style>
</head>
<body>
<div id="island"></div>
<script src="app.js"></script>
</body>
</html>
